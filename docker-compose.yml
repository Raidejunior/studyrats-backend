version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: db_studyrats
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10
    container_name: flyway_studyrats
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    command: >
      -url=${FLYWAY_URL} 
      -user=${FLYWAY_USER} 
      -password=${FLYWAY_PASSWORD} 
      migrate

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: studyrats-backend:1.0
    container_name: studyrats-backend
    depends_on:
      - postgres
      - flyway
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

volumes:
  postgres_data:
