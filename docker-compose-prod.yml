version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: db_studyrats_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10
    depends_on:
      - postgres
    env_file:
      - .env.prod
    volumes:
      - ./flyway/sql:/flyway/sql
    command: -url=${FLYWAY_URL} -user=${FLYWAY_USER} -password=${FLYWAY_PASSWORD} migrate

  backend:
    image: studyrats-backend:latest
    container_name: studyrats_backend_prod
    depends_on:
      - postgres
      - flyway
    env_file:
      - .env.prod
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    restart: always

volumes:
  postgres_data_prod:
